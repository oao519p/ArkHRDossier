<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>幹員卡片測試</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
    h2 { color: #f1f5f9; margin-bottom: 8px; font-size: 16px; }
    input[type=file] { color: #eee; margin-bottom: 16px; display: block; }

    /* ── 控制列 ── */
    #controls {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ctrl-label {
      font-size: 12px;
      color: #94a3b8;
      min-width: 52px;
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-group label {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      color: #cbd5e1;
      cursor: pointer;
      padding: 2px 6px;
      border: 1px solid #334155;
      border-radius: 4px;
      user-select: none;
    }
    .filter-group label:hover { border-color: #64748b; }
    .filter-group input[type=checkbox] { accent-color: #60a5fa; }
    .btn-sm {
      font-size: 11px;
      padding: 3px 8px;
      border: 1px solid #475569;
      border-radius: 4px;
      background: #1e293b;
      color: #cbd5e1;
      cursor: pointer;
    }
    .btn-sm:hover { background: #334155; }
    .btn-sm.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; }

    #count-label { font-size: 12px; color: #64748b; }

    /* 玩家資訊列 */
    #player-info {
      display: none;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      padding: 8px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      flex-wrap: wrap;
    }
    #player-info .pi-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #player-info .pi-label {
      font-size: 10px;
      color: #64748b;
      line-height: 1;
    }
    #player-info .pi-value {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1;
    }

    /* ── Grid ── */
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    /* ── 卡片外框 (PRTS 排版) ── */
    .op-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 120px;
    }

    .op-card {
      position: relative;
      width: 120px;
      height: 250px;
      overflow: hidden;
      background: #1a1a2e;

    }

    /* z-index 層次：
       1 = bg（背景裝飾，bottom:7 left:0）
       2 = 半身像（portrait-bg，在 bg 上面）
       3 = patch（左下角底色填充）
       3 = light（亮光，bottom:25 left:3，screen blend）
       4 = lh（底部裝飾，bottom:0 left:0）
       5 = uhs（uh 陰影，top:0 left:0）
       6 = uh（左上角裝飾，top:0 left:0）
       7 = 職業圖示（top:5 left:3）
       8 = 稀有度（top:0 left:30）
       9 = 底部 UI（等級、模組、技能、名字）
    */

    /* bg 背景裝飾（最底層，bottom:7 left:5px） */
    .op-card .deco-bg-img {
      position: absolute;
      bottom: 7px; left: 5px;
      width: 110px;
      z-index: 1;
      pointer-events: none;
    }

    /* 半身像（在 bg 上面） */
    .op-card .portrait-bg {
      position: absolute;
      top: 0; left: 5px;
      width: 110px;
      height: 220px;
      background-size: cover;
      background-position: center top;
      z-index: 2;
    }

    /* patch 左下角底色填充 */
    .op-card .patch {
      position: absolute;
      bottom: 5px; left: 5px;
      width: 80px;
      height: 30px;
      background-color: #2c2c2c;
      z-index: 3;
      pointer-events: none;
    }

    /* light 亮光（bottom:25） */
    .op-card .deco-light {
      position: absolute;
      bottom: 25px; left: 5px;
      width: 110px;
      z-index: 3;
      pointer-events: none;
    }

    /* lh 底部裝飾（bottom:0 left:0） */
    .op-card .deco-lh {
      position: absolute;
      bottom: 0; left: 0;
      width: 120px;
      z-index: 4;
      pointer-events: none;
    }

    /* uhs uh 陰影（top:0 left:0） */
    .op-card .deco-uhs {
      position: absolute;
      top: 0; left: 0;
      width: 70px;
      z-index: 5;
      pointer-events: none;
    }

    /* uh 左上角裝飾（top:0 left:0） */
    .op-card .deco-uh {
      position: absolute;
      top: 0; left: 0;
      width: 70px;
      z-index: 6;
      pointer-events: none;
    }

    /* 職業圖示（top:5 left:3） */
    .op-card .prof-icon {
      position: absolute;
      top: 5px; left: 3px;
      width: 25px;
      z-index: 7;
      pointer-events: none;
      object-fit: contain;
    }

    /* 稀有度（top:0 left:30） */
    .op-card .rarity-stars {
      position: absolute;
      top: 0; left: 30px;
      height: 18px;
      width: auto;
      z-index: 8;
      pointer-events: none;
      object-fit: contain;
    }

    /* ── 底部 UI 層：三欄各自 absolute，不互擠 ── */
    .op-card .bottom-row {
      position: absolute;
      bottom: 4px;
      left: 0;
      right: 3px;
      z-index: 9;
      /* 僅作定位容器，子欄自行 absolute */
      height: 0;
    }

    /* 左下：精英圖標 + 等級圈（靠左，底部對齊） */
    .op-card .bottom-left {
      position: absolute;
      bottom: 0;
      left: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding-bottom: 20px;
    }
    .op-card .elite-icon-above {
      width: 48px;
      object-fit: contain;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));
    }
    .op-card .level-circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    .op-card .level-lv {
      font-size: 6px;
      font-weight: 700;
      color: rgba(255,255,255,0.7);
      line-height: 1;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .op-card .level-text {
      font-size: 20px;
      font-family: 'Josefin Sans', 'Segoe UI', sans-serif;
      font-weight: 400;
      color: #fff;
      line-height: 1;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    /* 中下：模組格（置中，底部對齊，與右欄 char-name 等高） */
    .op-card .bottom-center {
      position: absolute;
      bottom: 0;
      left: 52%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 底部留出與 char-name 相同的高度，讓 equip-slot 頂部對齊技能圖 */
      padding-bottom: 18px;
    }
    .op-card .equip-slot {
      width: 38px;
      height: 38px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .op-card .equip-icon {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }
    .op-card .equip-icon.equip-original {
      transform: scale(0.7);
    }
    .op-card .equip-icon.equip-special {
      transform: scale(1.2);
    }

    /* 右下：潛能 + 技能 + 名字（靠右，底部對齊） */
    .op-card .bottom-right {
      position: absolute;
      bottom: 0;
      right: 5px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .op-card .potential-bg {
      background: rgba(0,0,0,0.3);
      border: 0.5px solid rgba(255,255,255,0.3);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: flex-end;
    }
    .op-card .potential-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      display: block;
    }
    .op-card .skill-icon-wrap {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .op-card .skill-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }
    .op-card .char-name {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0,0,0,0.95);
      line-height: 1.2;
    }


    /* 卡片下方名稱 */
    .op-name {
      font-size: 12px;
      color: #ccc;
      text-align: center;
      margin-top: 6px;
      max-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── 全技能專三紅光徽章 ── */
    .op-card .all-spec3-badge {
      position: absolute;
      top: 4px; right: 5px;
      width: auto;
      height: 20px;
      z-index: 10;
      pointer-events: none;
    }

    /* ── 淺色模式 ── */
    body.light { background: #f1f5f9; color: #1e293b; }
    body.light .btn-sm { background: #e2e8f0; border-color: #94a3b8; color: #334155; }
    body.light .btn-sm:hover { background: #cbd5e1; }
    body.light .btn-sm.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
    body.light #controls { background: transparent; }
    body.light .ctrl-label { color: #64748b; }
    body.light .filter-group label { color: #334155; border-color: #cbd5e1; }
    body.light .filter-group label:hover { border-color: #94a3b8; }
    body.light #player-info { background: #fff; border-color: #cbd5e1; }
    body.light #player-info .pi-label { color: #94a3b8; }
    body.light #player-info .pi-value { color: #1e293b; }
    body.light .op-card { background: #e2e8f0; border-color: #94a3b8; }
    body.light .op-name { color: #334155; }
    body.light #count-label { color: #94a3b8; }
    body.light input[type=text] { background: #fff !important; border-color: #94a3b8 !important; color: #1e293b !important; }
  </style>
</head>
<body>
<h2>🧪 幹員卡片測試</h2>
<input type="file" id="fileInput" accept=".json" />

<div id="player-info">
  <div class="pi-item"><span class="pi-label">UID</span><span class="pi-value" id="pi-uid">—</span></div>
  <div class="pi-item"><span class="pi-label">名稱</span><span class="pi-value" id="pi-name">—</span></div>
  <div class="pi-item"><span class="pi-label">伺服器</span><span class="pi-value" id="pi-channel">—</span></div>
  <div class="pi-item"><span class="pi-label">等級</span><span class="pi-value" id="pi-level">—</span></div>
</div>

<div id="controls">
  <!-- 職業 filter -->
  <div class="ctrl-row">
    <span class="ctrl-label">職業</span>
    <div class="filter-group" id="prof-filter"></div>
    <button class="btn-sm" id="prof-all">全選</button>
    <button class="btn-sm" id="prof-none">取消</button>
  </div>
  <!-- 稀有度 filter -->
  <div class="ctrl-row">
    <span class="ctrl-label">稀有度</span>
    <div class="filter-group" id="rarity-filter"></div>
    <button class="btn-sm" id="rarity-all">全選</button>
    <button class="btn-sm" id="rarity-none">取消</button>
  </div>
  <!-- 搜尋 -->
  <div class="ctrl-row">
    <span class="ctrl-label">搜尋</span>
    <input type="text" id="search-input" placeholder="幹員名稱..." style="font-size:12px;padding:3px 8px;border:1px solid #475569;border-radius:4px;background:#1e293b;color:#cbd5e1;width:160px;" />
    <button class="btn-sm" id="search-clear">✕</button>
  </div>
  <!-- 排序 -->
  <div class="ctrl-row">
    <span class="ctrl-label">排序</span>
    <button class="btn-sm active" id="sort-default" data-sort="default">原始順序</button>
    <button class="btn-sm" id="sort-elite" data-sort="elite">精英化+等級 ↓</button>
    <button class="btn-sm" id="sort-rarity" data-sort="rarity">稀有度 ↓</button>
    <button class="btn-sm" id="sort-prof" data-sort="prof">職業</button>
  </div>
  <!-- 技能切換 -->
  <div class="ctrl-row">
    <span class="ctrl-label">技能</span>
    <button class="btn-sm active" data-skill="default">Default only</button>
    <button class="btn-sm" data-skill="all">All skills</button>
    <button class="btn-sm" data-skill="none">關閉</button>
  </div>
  <!-- 顯示開關 -->
  <div class="ctrl-row">
    <span class="ctrl-label">顯示</span>
    <button class="btn-sm active" data-vis="rarity-bar">稀有度條</button>
    <button class="btn-sm active" data-vis="elite">精英化</button>
    <button class="btn-sm active" data-vis="level">等級</button>
    <button class="btn-sm active" data-vis="skill-badge">技能badge</button>
    <button class="btn-sm active" data-vis="equip">模組</button>
    <button class="btn-sm active" data-vis="rarity-icon">稀有度圖示</button>
    <button class="btn-sm active" data-vis="potential">潛能</button>
  </div>
  <!-- 名字切換 -->
  <div class="ctrl-row">
    <span class="ctrl-label">名字</span>
    <button class="btn-sm" id="name-toggle">顯示在卡片下方</button>
  </div>
  <!-- 色彩模式 -->
  <div class="ctrl-row">
    <span class="ctrl-label">色彩</span>
    <button class="btn-sm active" id="theme-toggle">🌙 深色</button>
  </div>
  <!-- 輸出 -->
  <div class="ctrl-row">
    <span class="ctrl-label">輸出</span>
    <button class="btn-sm" id="export-html">下載 HTML</button>
    <button class="btn-sm" id="export-cards">下載卡片圖片 (ZIP)</button>
    <button class="btn-sm" id="export-pause" style="display:none">⏸ 暫停</button>
    <button class="btn-sm" id="export-cancel" style="display:none">✕ 取消</button>
    <span id="export-status" style="font-size:11px;color:#64748b;"></span>
  </div>
  <!-- 計數 -->
  <div class="ctrl-row">
    <span id="count-label"></span>
  </div>
</div>


<div id="output"></div>

<script>
  const SKILL_NONE     = 'https://static.prts.wiki/charinfo/img/skland/skill_icon_none.png'
  const SKILL_FALLBACK = './image/skchr_svrash_1.png'

  // ── 本地補齊技能圖清單（在 ./image/ 資料夾下，檔名 {skillId}.png）──
  const LOCAL_SKILLS = new Set([
    'skchr_svrash_1',
    'skchr_huang_1',
    'skchr_lessng_1',
    'skchr_savage_1',
    'skchr_midn_1', // special
    'skchr_doberm_1',
    'skchr_bryota_1',
    'skchr_jesica_1',
    'skchr_vigna_1', // special
    'skchr_caper_1',
    'skchr_luton_1',
    'skchr_stward_1',
    'skchr_catap_1', // special
    // 繼續在這裡新增缺失的 skillId...
  ])

  const PROF_LABELS = {
    PIONEER: '先鋒', WARRIOR: '近衛', TANK: '重裝',
    SNIPER: '狙擊', CASTER: '術師', MEDIC: '醫療',
    SUPPORT: '輔助', SPECIAL: '特種'
  }
  const RARITY_LABELS = { 5:'★6', 4:'★5', 3:'★4', 2:'★3', 1:'★2', 0:'★1' }

  // 狀態
  let gData         = null
  let nameInline    = false
  let skillMode = 'default'  // 'default' | 'all' | 'none'
  let exportPaused    = false
  let exportCancelled = false
  let sortMode      = 'default'
  let sortDesc      = false
  let searchQuery   = ''
  const visFlags = {
    'rarity-bar':  true,
    'elite':       true,
    'level':       true,
    'skill-badge': true,
    'equip':       true,
    'rarity-icon': true,
    'potential':   true,
  }

  const PROF_ORDER = ['PIONEER','WARRIOR','TANK','SNIPER','CASTER','MEDIC','SUPPORT','SPECIAL']


  function skinIdToUrl(skinId) {
    if (!skinId) return ''
    let converted
    if (skinId.includes('@')) {
      converted = skinId.replace('@', '_').replace(/#/g, '%23')
    } else {
      converted = skinId.replace(/#/g, '_')
    }
    return `https://torappu.prts.wiki/assets/char_portrait/${converted}.png`
  }

  const rarityIconUrl = r  => `./image/rarity_icon/rarity_${r}_yellow.png`
  const profIconUrl   = p  => `./image/profession_large_icon/${p.toLowerCase()}.png`
  const eliteIconUrl  = e  => `./image/elite_icon/elite_${e}_large.png`
  const potentialUrl  = r  => `./image/potential_icon/potential_${r}.png`
  const skillIconUrl  = id => id ? `https://torappu.prts.wiki/assets/skill_icon/skill_icon_${id}.png` : SKILL_NONE
  const specIconUrl   = lv => `https://torappu.prts.wiki/assets/specialized_icon/specialized_tiny_${lv}.png`
  const equipIconUrl  = t  => t ? `https://torappu.prts.wiki/assets/uniequip_direction/${String(t).toLowerCase()}.png` : ''

  // 裝飾圖片根據稀有度選擇本地檔案（0-2 共用 0.png）
  function decoBgUrl(r)   { return `./image/deco-bg-img/${r <= 2 ? 0 : r}.png` }
  function decoLightUrl(r){ return `./image/deco-light/${r}.png` }
  function decoLhUrl(r)   { return `./image/deco-lh/${r <= 2 ? 0 : r}.png` }
  function decoUhUrl(r)   { return `./image/deco-uh/${r}.png` }
  function decoUhsUrl()   { return `./image/deco-uh/uhs.png` }

  function mkImg(src, cls, skillId) {
    const img = document.createElement('img')
    img.src = src
    if (cls) img.className = cls
    img.onerror = () => {
      if (skillId && LOCAL_SKILLS.has(skillId)) {
        // 有本地圖就用本地
        img.onerror = () => { img.src = SKILL_FALLBACK; img.style.opacity = '1' }
        img.src = `./image/${skillId}.png`
      } else if (skillId) {
        // CDN 找不到、也不在 LOCAL_SKILLS → 用 fallback
        img.onerror = null
        img.src = SKILL_FALLBACK
        img.style.opacity = '1'
      } else {
        img.style.opacity = '0'
      }
    }
    return img
  }

  function getChecked(groupId) {
    return [...document.querySelectorAll(`#${groupId} input[type=checkbox]:checked`)]
      .map(cb => cb.value)
  }

  function buildFilters(data) {
    const chars       = data.chars       || []
    const charInfoMap = data.charInfoMap || {}

    // 收集實際出現的職業 & 稀有度
    const profs    = new Set()
    const rarities = new Set()
    chars.forEach(c => {
      const info = charInfoMap[c.charId] || {}
      if (info.profession) profs.add(info.profession)
      const r = info.rarity ?? c.rarity ?? 0
      rarities.add(r)
    })

    // 職業 checkboxes（按固定順序）
    const profFilter = document.getElementById('prof-filter')
    profFilter.innerHTML = ''
    Object.keys(PROF_LABELS).forEach(p => {
      if (!profs.has(p)) return
      const lbl = document.createElement('label')
      const cb  = document.createElement('input')
      cb.type = 'checkbox'; cb.value = p; cb.checked = true
      cb.addEventListener('change', rerender)
      lbl.appendChild(cb)
      lbl.appendChild(document.createTextNode(PROF_LABELS[p]))
      profFilter.appendChild(lbl)
    })

    // 稀有度 checkboxes（從高到低）
    const rarityFilter = document.getElementById('rarity-filter')
    rarityFilter.innerHTML = ''
    ;[5,4,3,2,1,0].forEach(r => {
      if (!rarities.has(r)) return
      const lbl = document.createElement('label')
      const cb  = document.createElement('input')
      cb.type = 'checkbox'; cb.value = String(r); cb.checked = true
      cb.addEventListener('change', rerender)
      lbl.appendChild(cb)
      lbl.appendChild(document.createTextNode(RARITY_LABELS[r]))
      rarityFilter.appendChild(lbl)
    })

    document.getElementById('controls').style.display = 'flex'
  }

  function rerender() {
    if (!gData) return
    const allowedProfs    = new Set(getChecked('prof-filter'))
    const allowedRarities = new Set(getChecked('rarity-filter').map(Number))
    renderGrid(gData, allowedProfs, allowedRarities, searchQuery, sortMode)
  }

  function renderGrid(data, allowedProfs, allowedRarities, searchQuery, sortMode) {
    const out = document.getElementById('output')
    out.innerHTML = ''

    const chars        = data.chars        || []
    const charInfoMap  = data.charInfoMap  || {}
    const equipInfoMap = data.equipmentInfoMap || data.equipInfoMap || {}

    // 過濾
    const q = (searchQuery || '').trim().toLowerCase()
    let filtered = chars.filter(c => {
      const info   = charInfoMap[c.charId] || {}
      const rarity = info.rarity ?? c.rarity ?? 0
      const prof   = info.profession || 'PIONEER'
      if (!allowedProfs.has(prof))      return false
      if (!allowedRarities.has(rarity)) return false
      if (q) {
        const name = (info.name || c.charId).toLowerCase()
        if (!name.includes(q)) return false
      }
      return true
    })

    // 排序
    const d = sortDesc ? -1 : 1
    // 記錄原始索引供 default 排序用
    const origIndex = new Map(chars.map((c, i) => [c.charId + c.skinId, i]))
    filtered.sort((a, b) => {
      const ia = charInfoMap[a.charId] || {}
      const ib = charInfoMap[b.charId] || {}
      if (sortMode === 'default') {
        const oa = origIndex.get(a.charId + a.skinId) ?? 0
        const ob = origIndex.get(b.charId + b.skinId) ?? 0
        return (oa - ob) * d
      }
      if (sortMode === 'rarity') {
        const ra = ia.rarity ?? a.rarity ?? 0
        const rb = ib.rarity ?? b.rarity ?? 0
        return (rb - ra) * d
      }
      if (sortMode === 'prof') {
        const pa = PROF_ORDER.indexOf(ia.profession || 'PIONEER')
        const pb = PROF_ORDER.indexOf(ib.profession || 'PIONEER')
        if (pa !== pb) return (pa - pb) * d
        // 同職業內固定按精英化+等級降序
        if (b.evolvePhase !== a.evolvePhase) return b.evolvePhase - a.evolvePhase
        return b.level - a.level
      }
      // elite：精英化 → 等級
      if (b.evolvePhase !== a.evolvePhase) return (b.evolvePhase - a.evolvePhase) * d
      return (b.level - a.level) * d
    })

    const grid = document.createElement('div')
    grid.className = 'grid'

    let shown = 0
    filtered.forEach(c => {
      const info   = charInfoMap[c.charId] || {}
      const rarity = info.rarity ?? c.rarity ?? 0
      const prof   = info.profession || 'PIONEER'

      shown++

      const defaultSkillId = c.defaultSkillId || ''
      const defaultEquipId = c.defaultEquipId || ''
      const equipInfo      = equipInfoMap[defaultEquipId] || {}
      const typeIcon       = equipInfo.typeIcon || ''

      const mainSkillLvl = c.mainSkillLvl || 0
      let specLevel = 0
      if (mainSkillLvl === 7 && c.skills && defaultSkillId) {
        const sk = c.skills.find(s => s.id === defaultSkillId)
        if (sk) specLevel = sk.specializeLevel || 0
      }

      // 判斷是否全技能專三
      // rarity 5（6星）= 3技能，rarity 4（5星）= 2技能，rarity 3（4星）= 2技能，其他不計
      let isAllSpec3 = false
      if (c.skills && c.skills.length > 0 && (rarity === 5 || rarity === 4 || rarity === 3)) {
        const requiredCount = rarity === 5 ? 3 : 2
        const skillsWithSpec = c.skills.filter(s => typeof s.specializeLevel === 'number')
        if (skillsWithSpec.length >= requiredCount) {
          const topSkills = skillsWithSpec.slice(0, requiredCount)
          isAllSpec3 = topSkills.every(s => s.specializeLevel === 3)
        }
      }

      // ── 建卡片 ──
      const wrap = document.createElement('div')
      wrap.className = 'op-wrap'

      const card = document.createElement('div')
      card.className = 'op-card'

      // 半身像（最底層，z-index 0）
      const portraitBg = document.createElement('div')
      portraitBg.className = 'portrait-bg'
      portraitBg.style.backgroundImage = `url('${skinIdToUrl(c.skinId)}')`
      card.appendChild(portraitBg)

      // bg 背景裝飾（z-index 1，bottom:7 left:0，同卡片寬）
      const decoBgImg = mkImg(decoBgUrl(rarity), 'deco-bg-img')
      card.appendChild(decoBgImg)

      // patch 左下角底色填充（z-index 3）
      const patch = document.createElement('div')
      patch.className = 'patch'
      card.appendChild(patch)

      // light 亮光（z-index 3，bottom:25 left:3，screen blend）
      const decoLight = mkImg(decoLightUrl(rarity), 'deco-light')
      card.appendChild(decoLight)

      // lh 底部裝飾（z-index 2，bottom:0 left:0）
      const decoLh = mkImg(decoLhUrl(rarity), 'deco-lh')
      card.appendChild(decoLh)

      // uhs uh 陰影（z-index 3，top:0 left:0）
      const decoUhs = mkImg(decoUhsUrl(), 'deco-uhs')
      card.appendChild(decoUhs)

      // uh 左上角裝飾（z-index 4，top:0 left:0）
      const decoUh = mkImg(decoUhUrl(rarity), 'deco-uh')
      card.appendChild(decoUh)

      // 職業圖示（z-index 5，top:5 left:3）
      card.appendChild(mkImg(profIconUrl(prof), 'prof-icon'))

      // 稀有度（z-index 6，top:0 left:30）
      if (visFlags['rarity-icon']) {
        card.appendChild(mkImg(rarityIconUrl(rarity), 'rarity-stars'))
      }

      // 全技能專三紅光徽章（右上角，z-index 10）
      if (isAllSpec3) {
        card.appendChild(mkImg(
          './image/specialized_icon/spec3.png',
          'all-spec3-badge'
        ))
      }

      // 底部列（三欄底部對齊）
      const bottomRow = document.createElement('div')
      bottomRow.className = 'bottom-row'

      // 左：精英圖標 + 等級圈
      const bottomLeft = document.createElement('div')
      bottomLeft.className = 'bottom-left'
      if (visFlags['elite']) {
        bottomLeft.appendChild(mkImg(eliteIconUrl(c.evolvePhase), 'elite-icon-above'))
      }
      if (visFlags['level']) {
        const levelCircle = document.createElement('div')
        levelCircle.className = 'level-circle'
        const lvLabel = document.createElement('span')
        lvLabel.className = 'level-lv'
        lvLabel.textContent = 'LV'
        const lvTxt = document.createElement('span')
        lvTxt.className = 'level-text'
        lvTxt.textContent = c.level
        levelCircle.appendChild(lvLabel)
        levelCircle.appendChild(lvTxt)
        bottomLeft.appendChild(levelCircle)
      }
      bottomRow.appendChild(bottomLeft)

      // 中：模組格（有模組才顯示，否則空佔位）
      const bottomCenter = document.createElement('div')
      bottomCenter.className = 'bottom-center'
      if (visFlags['equip'] && typeIcon) {
        const equipSlot = document.createElement('div')
        equipSlot.className = 'equip-slot'
        const equipImg = mkImg(equipIconUrl(typeIcon), 'equip-icon')
        if (typeIcon && typeIcon.toLowerCase() === 'original') {
          equipImg.classList.add('equip-original')
        } else {
          equipImg.classList.add('equip-special')
        }
        equipSlot.appendChild(equipImg)
        bottomCenter.appendChild(equipSlot)
      }
      bottomRow.appendChild(bottomCenter)

      // 右：潛能 + 技能 + 名字
      const bottomRight = document.createElement('div')
      bottomRight.className = 'bottom-right'
      if (visFlags['potential']) {
        const potBg = document.createElement('div')
        potBg.className = 'potential-bg'
        potBg.appendChild(mkImg(potentialUrl(c.potentialRank), 'potential-icon'))
        bottomRight.appendChild(potBg)
      }
      if (skillMode !== 'none') {
        const skillWrap = document.createElement('div')
        skillWrap.className = 'skill-icon-wrap'
        skillWrap.appendChild(mkImg(skillIconUrl(defaultSkillId), 'skill-icon', defaultSkillId || null))
        bottomRight.appendChild(skillWrap)
      }
      const charName = document.createElement('div')
      charName.className = 'char-name'
      charName.textContent = info.name || c.charId
      bottomRight.appendChild(charName)
      bottomRow.appendChild(bottomRight)

      card.appendChild(bottomRow)

      wrap.appendChild(card)

      // 卡片下方名稱
      const nameEl = document.createElement('div')
      nameEl.className = nameInline ? 'op-name hidden' : 'op-name'
      nameEl.textContent = info.name || c.charId
      wrap.appendChild(nameEl)

      grid.appendChild(wrap)
    })

    out.appendChild(grid)
    document.getElementById('count-label').textContent =
      `顯示 ${shown} / ${chars.length} 位幹員`
  }

  function showPlayerInfo(data) {
    const meta   = data._meta   || {}
    const status = data.status  || {}
    const uid     = meta.uid        || status.uid  || '—'
    const name    = meta.nickName   || status.name || '—'
    const channel = meta.channelName || '—'
    const level   = status.level    || '—'
    document.getElementById('pi-uid').textContent     = uid
    document.getElementById('pi-name').textContent    = name
    document.getElementById('pi-channel').textContent = channel
    document.getElementById('pi-level').textContent   = level
    document.getElementById('player-info').style.display = 'flex'
  }

  function getPlayerUid() {
    return (gData?._meta?.uid || gData?.status?.uid || 'unknown')
  }

  // ── 事件綁定 ──
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0]
    if (!file) return
    const reader = new FileReader()
    reader.onload = ev => {
      try {
        gData = JSON.parse(ev.target.result)
        showPlayerInfo(gData)
        buildFilters(gData)
        rerender()
      } catch(err) {
        document.getElementById('output').innerHTML =
          `<p style="color:red">解析失敗: ${err.message}</p>`
      }
    }
    reader.readAsText(file)
  })

  // ── 顯示開關 ──
  document.querySelectorAll('[data-vis]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.vis
      visFlags[key] = !visFlags[key]
      btn.classList.toggle('active', visFlags[key])
      rerender()
    })
  })

  // ── 搜尋 ──
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value
    rerender()
  })
  document.getElementById('search-clear').addEventListener('click', () => {
    searchQuery = ''
    document.getElementById('search-input').value = ''
    rerender()
  })

  // ── 排序 ──
  const SORT_LABELS = {
    default:['原始順序',       '原始順序 ↑'],
    elite:  ['精英化+等級 ↓', '精英化+等級 ↑'],
    rarity: ['稀有度 ↓',      '稀有度 ↑'],
    prof:   ['職業 ↓',        '職業 ↑'],
  }
  function updateSortBtns() {
    document.querySelectorAll('[data-sort]').forEach(b => {
      const isActive = b.dataset.sort === sortMode
      b.classList.toggle('active', isActive)
      b.textContent = SORT_LABELS[b.dataset.sort][isActive && !sortDesc ? 1 : 0]
    })
  }
  document.querySelectorAll('[data-sort]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.sort === sortMode) {
        sortDesc = !sortDesc   // 同按鈕再點：切換升/降
      } else {
        sortMode = btn.dataset.sort
        sortDesc = false       // 換按鈕：重置為升序
      }
      updateSortBtns()
      rerender()
    })
  })

  document.getElementById('prof-all').addEventListener('click', () => {
    document.querySelectorAll('#prof-filter input').forEach(cb => cb.checked = true)
    rerender()
  })
  document.getElementById('prof-none').addEventListener('click', () => {
    document.querySelectorAll('#prof-filter input').forEach(cb => cb.checked = false)
    rerender()
  })
  document.getElementById('rarity-all').addEventListener('click', () => {
    document.querySelectorAll('#rarity-filter input').forEach(cb => cb.checked = true)
    rerender()
  })
  document.getElementById('rarity-none').addEventListener('click', () => {
    document.querySelectorAll('#rarity-filter input').forEach(cb => cb.checked = false)
    rerender()
  })

  // ── 輸出 HTML ──
  document.getElementById('export-html').addEventListener('click', () => {
    const gridHtml = document.getElementById('output').innerHTML
    if (!gridHtml) return
    const styleEl = document.querySelector('style')
    const css = styleEl ? styleEl.innerHTML : ''
    const uid     = document.getElementById('pi-uid').textContent
    const name    = document.getElementById('pi-name').textContent
    const channel = document.getElementById('pi-channel').textContent
    const level   = document.getElementById('pi-level').textContent
    const playerBar = `<div style="display:flex;gap:24px;margin-bottom:16px;padding:8px 12px;background:#1e293b;border:1px solid #334155;border-radius:6px;flex-wrap:wrap;">
  <div><div style="font-size:10px;color:#64748b">UID</div><div style="font-size:14px;font-weight:700;color:#f1f5f9">${uid}</div></div>
  <div><div style="font-size:10px;color:#64748b">名稱</div><div style="font-size:14px;font-weight:700;color:#f1f5f9">${name}</div></div>
  <div><div style="font-size:10px;color:#64748b">伺服器</div><div style="font-size:14px;font-weight:700;color:#f1f5f9">${channel}</div></div>
  <div><div style="font-size:10px;color:#64748b">等級</div><div style="font-size:14px;font-weight:700;color:#f1f5f9">${level}</div></div>
</div>`
    const html = `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>幹員卡片 - ${name} (${uid})</title>
<style>${css}</style>
</head>
<body style="background:#111;padding:20px;">
${playerBar}
${gridHtml}
</body>
</html>`
    const blob = new Blob([html], { type: 'text/html' })
    const a = document.createElement('a')
    a.href = URL.createObjectURL(blob)
    a.download = `operator_cards_${uid}.html`
    a.click()
  })

  // ── 輸出個別卡片圖片 (ZIP) ──
  document.getElementById('export-cards').addEventListener('click', async () => {
    const cards = [...document.querySelectorAll('.op-card')]
    if (!cards.length) return
    const statusEl   = document.getElementById('export-status')
    const btnPause   = document.getElementById('export-pause')
    const btnCancel  = document.getElementById('export-cancel')
    const btnExport  = document.getElementById('export-cards')

    exportPaused    = false
    exportCancelled = false
    btnPause.style.display  = ''
    btnCancel.style.display = ''
    btnExport.disabled = true
    statusEl.textContent = '載入中...'

    async function loadScript(src) {
      return new Promise((res, rej) => {
        if (document.querySelector(`script[src="${src}"]`)) return res()
        const s = document.createElement('script')
        s.src = src; s.onload = res; s.onerror = rej
        document.head.appendChild(s)
      })
    }
    try {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js')
    } catch(e) {
      statusEl.textContent = '載入函式庫失敗，請確認網路連線'
      btnPause.style.display = btnCancel.style.display = 'none'
      btnExport.disabled = false
      return
    }

    const zip = new JSZip()
    const uid = getPlayerUid()

    for (let i = 0; i < cards.length; i++) {
      // 等待暫停解除
      while (exportPaused && !exportCancelled) {
        await new Promise(r => setTimeout(r, 200))
      }
      if (exportCancelled) {
        statusEl.textContent = '已取消'
        break
      }

      const card   = cards[i]
      const wrap   = card.closest('.op-wrap')
      const nameEl = wrap?.querySelector('.op-name')
      const name   = (nameEl?.textContent || `card_${i + 1}`).trim().replace(/[\\/:*?"<>|]/g, '_')
      statusEl.textContent = `處理中 ${i + 1} / ${cards.length}　${name}`
      try {
        const canvas = await html2canvas(card, {
          useCORS: true, allowTaint: false, scale: 2, backgroundColor: null
        })
        const blob = await new Promise(r => canvas.toBlob(r, 'image/png'))
        zip.file(`${String(i + 1).padStart(3, '0')}_${name}.png`, blob)
      } catch(e) {
        console.warn('卡片截圖失敗:', name, e)
      }
    }

    btnPause.style.display = btnCancel.style.display = 'none'
    btnExport.disabled = false

    if (!exportCancelled) {
      statusEl.textContent = '打包中...'
      const zipBlob = await zip.generateAsync({ type: 'blob' })
      const a = document.createElement('a')
      a.href = URL.createObjectURL(zipBlob)
      a.download = `operator_cards_${uid}.zip`
      a.click()
      statusEl.textContent = `完成，共 ${cards.length} 張`
    }
  })

  document.getElementById('export-pause').addEventListener('click', () => {
    exportPaused = !exportPaused
    document.getElementById('export-pause').textContent = exportPaused ? '▶ 繼續' : '⏸ 暫停'
  })

  document.getElementById('export-cancel').addEventListener('click', () => {
    exportCancelled = true
    exportPaused    = false
  })

  document.querySelectorAll('[data-skill]').forEach(btn => {
    btn.addEventListener('click', () => {
      skillMode = btn.dataset.skill
      document.querySelectorAll('[data-skill]').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      rerender()
    })
  })

  updateSortBtns()

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const btn = document.getElementById('theme-toggle')
    const isLight = document.body.classList.toggle('light')
    btn.textContent = isLight ? '☀️ 淺色' : '🌙 深色'
    btn.classList.toggle('active', !isLight)
  })

  document.getElementById('name-toggle').addEventListener('click', () => {
    nameInline = !nameInline
    const btn = document.getElementById('name-toggle')
    btn.textContent = nameInline ? '顯示在卡片內嵌' : '顯示在卡片下方'
    btn.classList.toggle('active', nameInline)
    rerender()
  })
</script>
</body>
</html>
